services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dxc-vending-machine-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dxc-vending-machine-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
